<!DOCTYPE html>
<html>
<head>
    <title>New Ticket</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; background: #2c3e50; color: white; border: none;
                 padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        a { display: inline-block; margin-top: 15px; color: #2c3e50; }
    </style>
</head>
<body>
    <h1>Submit a New Ticket</h1>
    <form method="POST">
        <label>Title</label>
        <input type="text" name="title" placeholder="e.g. WiFi keeps disconnecting" required>

        <label>Description</label>
        <textarea name="description" rows="5" placeholder="Describe the problem in detail..." required></textarea>

        <button type="submit">Submit Ticket</button>
    </form>
    <a href="/">← Back to all tickets</a>
</body>
</html>
