<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; width: 100%; background: #2c3e50; color: white; border: none;
                 padding: 10px; border-radius: 6px; cursor: pointer; font-size: 15px; }
        .flash { background: #fdecea; color: #b71c1c; padding: 10px; border-radius: 6px; margin-top: 15px; }
        .link { margin-top: 15px; text-align: center; }
        a { color: #2c3e50; }
    </style>
</head>
<body>
    <h1>🎫 IT Ticket Triage</h1>
    <h2>Log In</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Log In</button>
    </form>

    <div class="link">Don't have an account? <a href="/register">Register here</a></div>
</body>
</html>
